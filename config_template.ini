[common]
; 使用cookie登录，填写true则忽略账号密码，直接从cookies.txt读取cookie登录
use_cookies=false

; 手机号账号(必填)
username = 你的手机号

; 登录密码(必填)
password = 你的密码

; 要学习的课程ID列表, 逗号隔开(选填，不需要则留空)
course_list =

; 视频播放倍速(默认1，最大2)
speed = 1

; 同时进行的章节数量
jobs = 1

; 遇到关闭任务点时的行为: retry-重试(默认), continue-继续
notopen_action = retry

[tiku]
; 题库通道: 本地融合代理 (答题前需先双击 start_proxy.bat)
provider=TikuAdapter
; 是否提交答题: true=答题后提交, false=只保存不提交
submit=true
; 最低题库覆盖率
cover_rate=0
; 搜题间隔, 单位秒
delay=1.0
; 言溪题库TOKEN, 多个用英文逗号隔开 (代理使用, 用量在 dashboard 查看)
tokens=你的言溪题库TOKEN
; 本地融合代理地址
url=http://127.0.0.1:8765/adapter
; 判断题答案对应词 (代理使用)
true_list=正确,对,√,是
false_list=错误,错,×,否,不对,不正确

; ---- 可选: 大模型兜底(题库查不到的题含图片题), 留空不启用 ----
; 需OpenAI格式、支持读图的模型, 例:
;   llm_endpoint=https://api.siliconflow.cn/v1
;   llm_model=Qwen/Qwen2.5-VL-72B-Instruct
llm_endpoint=
llm_key=
llm_model=
llm_min_interval_seconds=2

[notification]
; 可选: 结果推送, 填上url才生效
provider=ServerChan
url=
